# Merge into CPA config.yaml. CPA owns/authenticates downstream keys.
api-keys:
  - "replace-with-a-real-api-key"
plugins:
  enabled: true
  dir: "plugins"
  configs:
    # Runtime ID retained for upgrade compatibility.
    key-provider-access:
      enabled: true
      priority: 100
      version: 3
      access_control_enabled: true
      default_deny: true
      groups: []
      policies: []
      # Use the UI to create groups, choose profiles and assign keys, then save.
      # Optional existing YAML/TOML file (v2 migrates to v3):
      # policy_file: "config/key-provider-access-policies.yaml"
