version: 3
access_control_enabled: true
default_deny: false
# Only groups define upstream rules. Empty allow lists grant nothing.
groups:
  - id: developers
    name: Developers
    allow_profiles: ["codex:apikey:abc123def456", "oauth-profile-id"]
    deny_profiles: ["*-retired"]
  - id: restricted
    name: Restricted
    allow_profiles: []
    deny_profiles: ["private-*"]
# Use the UI to derive caller scopes; do not enter raw API keys.
policies:
  - caller_scope: "f7291f3315e5ab0d3c02015a081879d748693f231d8370b43f38f57be991734a"
    group_ids: [developers, restricted]
